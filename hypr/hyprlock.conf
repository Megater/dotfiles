# BACKGROUND
background {
    monitor = DP-3
    path = ~/.local/Wallpapers/platform_dark.jpg
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.8
}

background {
    monitor = HDMI-A-1
    path = ~/.local/Wallpapers/platform_gruv.jpg
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.8
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor = DP-3
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(60, 56, 54)
    inner_color = rgba(40, 40, 40, 0.85)
    font_color = rgb(235, 219, 178)
    fade_on_empty = false
    font_family = JetbrainsMono Nerd Font
    placeholder_text = <i><b><span foreground="##ffffff99">Enter Pass</span></b></i>
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
}

# Time
label {
    monitor =DP-3
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgb(213, 196, 161)
    font_size = 130
    font_family = JetbrainsMono Nerd Font
    position = 0, 240
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =DP-3
    text = cmd[update:1000] echo -e "<b>$(date +"%A, %d %B")</b>"
    color = rgb(235, 219, 178)
    font_size = 30
    font_family = JetbrainsMono Nerd Font
    position = 0, 105
    halign = center
    valign = center
}

# Profie-Photo
image {
    monitor =DP-3
    path = ~/.local/Profile_photo/profile.png
    border_color = 0xffdddddd
    border_size = 0
    size = 120
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, -20
    halign = center
    valign = center
}

# USER
label {
    monitor =DP-3
    text = <b>Hi, Mateusz</b>
    color = rgb(235, 219, 178)
    font_size = 25
    font_family = JetbrainsMono Nerd Font Bold
    position = 0, -130
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =DP-3
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/songdetail.sh)" 
    color = rgb(213, 196, 161)
    font_size = 18
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = 0, 60
    halign = center
    valign = bottom
}
